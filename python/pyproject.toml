[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ddi-toolkit"
version = "1.0.0"
description = "Educational calculators from 'Drug-Drug Interactions in Drug Safety and Pharmacovigilance'. Not for dosing or clinical decisions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-4.0" }
keywords = ["pharmacovigilance", "drug-drug interactions", "pharmacokinetics", "disproportionality", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ddi-toolkit = "ddi_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
